<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/beneco-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BENECO Enterprise System (BES)</title>
    <script>
      (function () {
        try {
          var mode = JSON.parse(localStorage.getItem('bes:theme-mode') || '"system"');
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
